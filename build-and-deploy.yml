name: Despliegue Odoo via SSH
on: 
  push:
    branches:
      - main  # Rama principal, puede ser sobrescrita por env

env:
  SERVER_IP: # IP o dominio del servidor
  SSH_USER: # Usuario SSH para el servidor
  DOCKER_ODOO: # Nombre del contenedor Docker de Odoo
  DOCKER_DB: # Nombre del contenedor Docker de PostgreSQL
  REPO_NAME: # Nombre del repositorio
  RAMA_PRINCIPAL: # Nombre de la rama principal (ej: 17.0, main, master)
  PUERTO_ACTUALIZACION: # Puerto para las actualizaciones
  RUTA_ODOO: # Ruta a la instalación de Odoo (ej: /home/usuario/Odoo/17.0/repos)
  RUTA_MODULOS: # Ruta a los módulos personalizados (relativa a RUTA_ODOO)

jobs:
  actualizar_codigo:
    name: Actualizar Código
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código
      uses: actions/checkout@v3
    
    - name: Configurar clave SSH
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Ejecutar git pull en el servidor
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.SERVER_IP }}
        username: ${{ env.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd ${{ env.RUTA_ODOO }}/${{ env.REPO_NAME }}
          git fetch
          git checkout ${{ env.RAMA_PRINCIPAL }}
          git pull
          echo "Código actualizado correctamente"

  desplegar:
    runs-on: ubuntu-latest
    needs: actualizar_codigo
    steps:
      - name: Desplegar y Actualizar Odoo
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Navegar al directorio de módulos
            cd ${{ env.RUTA_ODOO }}/${{ env.REPO_NAME }}/${{ env.RUTA_MODULOS }}
            
            # Obtener lista de módulos (directorios con __manifest__.py)
            modulos=$(find . -maxdepth 2 -name '__manifest__.py' | sed -r 's|/[^/]+$||' | sed 's/\.\///' | sort | uniq | xargs echo | sed 's/ /,/g')
            
            if [ -z "$modulos" ]; then
              echo "No se encontraron módulos para actualizar"
              exit 0
            fi

            echo "Actualizando módulos: $modulos"
            
            # Obtener lista de bases de datos y actualizar cada una
            databases=$(sudo docker exec ${{ env.DOCKER_DB }} psql -U odoo postgres -t -c "SELECT datname FROM pg_database WHERE datistemplate = false AND datname NOT LIKE 'pg_%';")
            for db in $databases; do
              echo "Actualizando base de datos: $db"
              sudo docker exec ${{ env.DOCKER_ODOO }} odoo -u "$modulos" -d "$db" \
                --http-port ${{ env.PUERTO_ACTUALIZACION }} \
                --longpolling-port ${{ env.PUERTO_ACTUALIZACION }} \
                --stop-after-init \
                --i18n-overwrite
            done

            # Reiniciar contenedor de Odoo
            sudo docker restart ${{ env.DOCKER_ODOO }}
            echo "Despliegue completado con éxito"